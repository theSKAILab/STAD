
abstract=The Spatial Temporal Aggregate Data (STAD) ontology provides a machine-interpretable representation of the semantics of statistically aggregated spatial and temporal data.  Published aggregate data often lack explicit information about how values were computed, which source data were used, and the spatial and temporal conditions under which the values apply. STAD addresses this limitation by representing four central aspects of an aggregate datapoint: its base data, transformation method, spatial support (spatial coverage), and temporal support (temporal coverage and aggregation period), together with its quality kind and value. It provides a reusable ontology built around this core ontology design pattern, with refinements specifically targeting spatial and temporal aggregates. The ontology supports semantically describing other important concepts and relationships closely related to aggregate datapoints, including datasets, datapoints (including quality kinds and values), spatial and temporal resolution, and computational transformation kinds. Implemented as a reusable OWL 2 ontology, STAD supports the consistent publication, discovery, comparison, integration, and querying of aggregated data across heterogeneous datasets and knowledge graphs.
