description=STAD provides syntax for describing the spatial and temporal characteristics of aggregate quantities.
introduction=Advances in data collection technologies have made large volumes of spatial and temporal data available across environmental science, climate research, ecology, public health, and many other domains. Such data are frequently aggregated using operations such as the arithmetic mean, minimum, maximum, or percentile. Aggregation can reduce storage and processing requirements, reveal broader patterns, facilitate decision-making, and protect sensitive information.

Nevertheless, an aggregate value cannot be interpreted reliably from its label alone. Two values described as “daily mean temperature,” for example, may have been calculated from 24 hourly observations, from minute-level observations, or from only the daily minimum and maximum. Similarly, two seasonal aggregates may differ in the periods regarded as belonging to the season, the spatial areas they represent, the resolution of their source data, or the transformations used to compute them. Without explicit descriptions of these characteristics, aggregate data can be difficult to discover, compare, integrate, and reuse correctly.

The Spatial Temporal Aggregate Data (STAD) ontology addresses this problem by making aggregation semantics explicit and machine interpretable. STAD provides an ontology design pattern for characterizing aggregate datapoints through their base data, transformation method, spatial support, and temporal support. It extends this pattern into a broader semantic framework for datasets, datapoints, values, quality kinds, resolution, and computational provenance. STAD is intended for use across domains in which spatially or temporally aggregated data must be represented, queried, or compared.

